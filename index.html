<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GIA 💔</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    }

    .page {
      width: min(100%, 480px);
      min-height: 100vh;
      margin: auto;
      padding-bottom: 40px;
      background: #000;
    }

    /* Photo carrée avec fondu vers le noir */
    .hero {
      width: 100%;
      aspect-ratio: 1 / 1;
      position: relative;
      overflow: hidden;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 40%,
        rgba(0, 0, 0, .6) 75%,
        #000 100%
      );
    }

    .profile {
      position: absolute;
      z-index: 1;
      bottom: 4px;
      width: 100%;
      padding: 0 16px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .username {
      margin: 2px 0 0;
      color: #a8a8a8;
      font-size: 15px;
      font-weight: 500;
    }

    /* Icônes : ordre TikTok, Instagram, Telegram */
    .socials {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 12px 0 18px;
    }

    .social {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      transition: transform .2s ease;
    }

    .social:hover { transform: translateY(-3px); }
    .social svg { width: 22px; height: 22px; }

    .tiktok { background: #000; }
    .instagram {
      background: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
    }
    .telegram { background: #4a8fe7; }

    /* Phrase d'accroche sous les icônes */
    .description {
      margin: 0 0 18px;
      text-align: center;
      font-size: 17px;
      font-weight: 400;
      color: #fff;
    }

    /* Encadré en verre dépoli, sans contour */
    .feature {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 16px;
      padding: 10px;
      border: none;
      border-radius: 20px;
      background: linear-gradient(
        120deg,
        rgba(120, 100, 85, .45) 0%,
        rgba(75, 62, 55, .35) 45%,
        rgba(30, 27, 25, .55) 100%
      );
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      color: #fff;
      text-decoration: none;
    }

    .feature img {
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      border-radius: 10px;
      object-fit: cover;
    }

    .feature-text {
      flex: 1;
      text-align: left;
    }

    .feature-title {
      display: block;
      font-size: 16px;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="hero">
      <img src="https://emmadefava.github.io/gia-page/hero.jpg" alt="Photo de GIA">

      <div class="profile">
        <h1>GIA 💔</h1>
        <p class="username">@emmadefava</p>
      </div>
    </section>

    <nav class="socials" aria-label="Mes réseaux sociaux">
      <a class="social tiktok"
         href="https://www.tiktok.com/@emmadefava?_r=1&_t=ZN-9BB5QzBdZqQ"
         aria-label="TikTok" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M14 3v11.2a4.2 4.2 0 1 1-3.5-4.1M16 5.2c.8 2 2.3 3.4 4.5 3.8"
                stroke="#25F4EE" stroke-width="3" stroke-linecap="round"/>
          <path d="M14 3v11.2a4.2 4.2 0 1 1-3.5-4.1M16 5.2c.8 2 2.3 3.4 4.5 3.8"
                stroke="#FE2C55" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M14 3v11.2a4.2 4.2 0 1 1-3.5-4.1M16 5.2c.8 2 2.3 3.4 4.5 3.8"
                stroke="white" stroke-width="1" stroke-linecap="round"/>
        </svg>
      </a>

      <a class="social instagram"
         href="https://www.instagram.com/emmadefava"
         aria-label="Instagram" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5" stroke="white" stroke-width="2"/>
          <circle cx="12" cy="12" r="4" stroke="white" stroke-width="2"/>
          <circle cx="18" cy="6.5" r="1.2" fill="white"/>
        </svg>
      </a>

      <a class="social telegram"
         href="https://t.me/giashkaa"
         aria-label="Telegram" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="white" aria-hidden="true">
          <path d="M21.7 4.4 18.5 20c-.2 1.1-.9 1.4-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L6 13.6 1.1 12c-1.1-.3-1.1-1 .2-1.5L20.4 3c.9-.3 1.7.2 1.3 1.4Z"/>
        </svg>
      </a>
    </nav>

    <p class="description">Dream girl, model, law student</p>

    <a class="feature" href="https://t.me/giashkaa"
       target="_blank" rel="noopener noreferrer">
      <img src="https://emmadefava.github.io/gia-page/telegram.jpg" alt="">
      <span class="feature-text">
        <span class="feature-title">Join me 💕</span>
      </span>
    </a>
  </main>
</body>
</html>
